
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Your Bucket List 🪣</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- Progress -->

  <div class="progress-card">

    <h2>{{completedItems}} / {{totalItems}}</h2>

    <p>{{progress | number:'1.0-0'}}% Complete</p>

    <ion-progress-bar [value]="progress / 100"></ion-progress-bar>

  </div>

  <!-- Add Button -->

  <ion-button expand="block" (click)="addBucketItem()">
    + Add Bucket List Item
  </ion-button>

  <!-- Tabs -->

  <ion-segment [(ngModel)]="selectedTab">

    <ion-segment-button value="incomplete">
      <ion-label>Incomplete</ion-label>
    </ion-segment-button>

    <ion-segment-button value="completed">
      <ion-label>Completed</ion-label>
    </ion-segment-button>

  </ion-segment>

  <!-- Incomplete -->

  <div *ngIf="selectedTab === 'incomplete'">

    <ion-card *ngFor="let item of incompleteItems">

      <img [src]="item.image">

      <ion-card-header>

        <ion-card-title>

          <ion-input
            [(ngModel)]="item.title"
            placeholder="Bucket List Item">
          </ion-input>

        </ion-card-title>

      </ion-card-header>

      <ion-card-content>

        <ion-textarea
          [(ngModel)]="item.description"
          placeholder="Describe this goal...">
        </ion-textarea>

        <ion-button
          color="success"
          expand="block"
          (click)="toggleComplete(item)">
          Mark Complete ✓
        </ion-button>

        <ion-button
          color="danger"
          expand="block"
          (click)="deleteItem(item.id)">
          Delete
        </ion-button>

      </ion-card-content>

    </ion-card>

  </div>

  <!-- Completed -->

  <div *ngIf="selectedTab === 'completed'">

    <ion-card *ngFor="let item of completedBucketItems">

      <img [src]="item.image">

      <ion-card-header>

        <ion-card-title>{{item.title}}</ion-card-title>

      </ion-card-header>

      <ion-card-content>

        <p>{{item.description}}</p>

        <ion-button
          expand="block"
          color="warning"
          (click)="toggleComplete(item)">
          Move Back to Incomplete
        </ion-button>

        <ion-button
          expand="block"
          color="danger"
          (click)="deleteItem(item.id)">
          Delete
        </ion-button>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
