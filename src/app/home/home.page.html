<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Home
    </ion-title>
    <ion-button (click)="signOut()" color="danger" slot="end">
      Sign out
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    Hello, username
  </ion-header>

  <ion-card class="progress-card">
    <ion-grid>
      <ion-row>
        <ion-card-title class="progress-title"> Progress </ion-card-title>
      </ion-row>
      <ion-row class="progress-row">
        <div class="progress-ring-wrap">
          <svg viewBox="0 0 96 96">
            <circle class="ring-bg" cx="48" cy="48" r="40" stroke-width="12" fill="none" />
            <circle class="ring-fill" cx="48" cy="48" r="40" stroke-width="12" fill="none" stroke-dasharray="251.2"
              [attr.stroke-dashoffset]="251.2 - (251.2 * goalsCompletedPercent / 100)" />
          </svg>
          <div class="ring-label">{{ goalsCompletedPercent }}%</div>
        </div>

        <div class="progress-text">
          <p class="count">{{ goalsCompleted }} of {{ goalsTotal }}</p>
          <p class="label">Goals Completed</p>
        </div>
      </ion-row>
    </ion-grid>
  </ion-card>

  <ion-grid class="next-up-grid">
    <ion-row class="ion-align-items-center">
      <ion-col size="6">
        <div class="next-up-image" role="img" aria-label="Kayaking with friends">
          <span class="next-up-label">Next Up</span>
        </div>
      </ion-col>

      <ion-col size="6" class="next-text">
        <h3 class="next-title">Kayaking with Friends</h3>
        <p class="next-date">July 18: 10:00 am</p>
        <ion-button class="details-btn" fill="solid" (click)="showEventDetails()">
          View Details
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>


<h2 class="section-title">Suggested For You</h2>

<div class="suggested-row">
  <div
    class="suggested-card"
    *ngFor="let event of suggestedEvents"
    (click)="showSuggestedDetails(event)"
  >
    <div class="suggested-image" [style.background-image]="'url(' + event.image + ')'"></div>
  </div>
</div>


</ion-content>
