<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Home
    </ion-title>
    <ion-button (click)="signOut()" color="danger" slot="end">
      Sign out
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    Hello, (username)
  </ion-header>
  <ion-card>
    Progress
  </ion-card>
  <ion-card>
    Next
  </ion-card>
  <ion-card>
    Suggested
  </ion-card>
</ion-content>
