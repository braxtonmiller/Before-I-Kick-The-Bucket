<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Home
    </ion-title>
    <ion-button (click)="signOut()" color="danger" slot="end">
      Sign out
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    Hello, (username)
  </ion-header>
  <ion-card class="progress-card">
    <ion-card class="progress-card">
      <img class="progress-card__bg" src="src/assets/mountainroad.jpg">
      <div class="progress-card__overlay"></div>
 
      <div class="progress-ring">
        <span class="progress-ring__label">{{ percentComplete }}%</span>
      </div>
 
      <div class="progress-card__text">
        <p class="progress-card__count">{{ goalsCompleted }} of {{ goalsTotal }}</p>
        <p class="progress-card__caption">Goals Completed</p>
      </div>
    </ion-card>
  </ion-card>
  <ion-card>
    Next
  </ion-card>
  <ion-card>
    Suggested
  </ion-card>
</ion-content>
