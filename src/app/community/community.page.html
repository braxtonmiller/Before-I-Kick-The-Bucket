<ion-header>
  <ion-toolbar>
    <ion-title>Community</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-searchbar
    [(ngModel)]="searchText"
    (ionInput)="searchFriends()"
    placeholder="Search users">
  </ion-searchbar>

  <ion-list lines="none">

    @for (friend of filteredFriends; track friend.username) {
      <ion-item button>

        <ion-avatar slot="start">
          <img [src]="friend.profilePicture">
        </ion-avatar>

        <ion-label>
          <h2>{{ friend.username }}</h2>
          <p>{{ friend.name }}</p>
        </ion-label>

      </ion-item>
    }

  </ion-list>

</ion-content>
