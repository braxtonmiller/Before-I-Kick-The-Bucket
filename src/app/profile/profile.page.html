<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content>

  @for(item of arrayOfInfo; track $index) {
  <app-profile-display [profileIn]="item">
  </app-profile-display>
  }
  

  <ion-card class="addProfileCard">

    <ion-grid>
      <ion-row></ion-row>
      <ion-row>
        <ion-col></ion-col>
        <ion-col>
          <ion-item>
            <ion-input [(ngModel)]="profileUsernameInput" placeholder="Enter username..." type="string"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input [(ngModel)]="profileEmailInput" placholder="Enter email..." type="string"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input [(ngModel)]="profilePhoneNumberInput" placeholder="Enter phone number..." type="string"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input [(ngModel)]="profileImageURLInput" placeholder="Enter image URL..." type="string"></ion-input>
          </ion-item>
          
          <ion-button class="addProfileButton" (click)="addNewProfile()">+Add Profile</ion-button>
        </ion-col>
        <ion-col></ion-col>
      </ion-row>
      <ion-row></ion-row>
    </ion-grid>

  </ion-card>
</ion-content>
