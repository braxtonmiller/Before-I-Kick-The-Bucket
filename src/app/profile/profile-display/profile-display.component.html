<ion-card class="ProfileCards">


  <ion-card-content >
    <div class="ProfilePictures">
      <img [src]="profileIn.profileImageURL" alt="profile-pic">
    </div>
    <ion-card-title>Username: {{profileIn.profileUsername}}</ion-card-title>
    <ion-card-subtitle>Email: {{profileIn.profileEmail}}</ion-card-subtitle>
    <ion-card-subtitle>Phone Number: {{profileIn.profilePhoneNumber}}</ion-card-subtitle>
  </ion-card-content>

</ion-card>
