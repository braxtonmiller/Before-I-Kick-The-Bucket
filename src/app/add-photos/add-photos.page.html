<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row class="ion-align-content-center">
      <ion-col size="4"> </ion-col>
      <ion-col size="4">
        <ion-button class="full-width">
          Add a bucket list item
        </ion-button>
      </ion-col>
      <ion-col size="4"> </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="2"></ion-col>
      <ion-col size="3">
        <ion-button class="full-width">
          Take a photo
        </ion-button>
      </ion-col>
      <ion-col size="2">
        <ion-title class="ion-text-center">
          OR
        </ion-title>
      </ion-col>
      <ion-col size="3">
        <ion-button class="full-width">
          Add photo to bucket list item
        </ion-button>
      </ion-col>
      <ion-col size="2"></ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
