<header>
  <ion-button (click)="closeCamera()">
    close
  </ion-button>
</header>

<div class="camera-container">
  <!-- Live stream view -->
  <video #video autoplay playsinline width="640" height="480"></video>
  
  <div class="controls">
    <ion-button (click)="capture()">Capture Photo</ion-button>
  </div>

  <!-- Hidden canvas used for processing the picture frame -->
  <canvas #canvas width="640" height="480" style="display: none;"></canvas>

  @if (capturedImage) {
  <!-- Gallery previewing captured images -->
  <div class="preview">
    <h3>Captured Image:</h3>
    <img [src]="capturedImage" alt="Snapshot" />
  </div>
}
</div>
